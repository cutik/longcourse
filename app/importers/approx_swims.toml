# Open-water races swum before the watch could record them (2019–2021, a
# Samsung watch whose archive Samsung later deleted). Rebuilt from official
# results where they exist and from the swimmer's memory where they do not.
#
# The TIME and DISTANCE are the race's own (protocol, archived results, medal
# engraving) — `time_source` says which. The TRACK is an approximation: a line
# through the course's published landmarks, with fixes spread evenly over the
# finish time. It is good enough to put the swim on the world map; it says
# nothing about how the swim was actually paced or steered.
#
# Imported by `python -m importers.approx` as provider 'approx'. A real track
# for the same session (provider apple/garmin) supersedes the approximation.
#
# Geometry, one of:
#   waypoints = [[lat, lon], ...]           a path through these points
#   start + legs = [[bearing°, metres], …]  dead reckoning from `start`
#   laps = N                                repeat the waypoints N times (loops)
#
# Coordinates: OpenStreetMap (Nominatim) for named places, Google Maps pins
# from the swimmer for Krabi and Sahl Hasheesh. Verified 2026-11-06.


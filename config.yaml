name: Longcourse
version: "0.5.1"
slug: longcourse
description: Apple Health + Garmin ingest, normalisation and MCP server for swim coaching
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# Host port 8787. The iPhone posts here over the LAN; the Cloudflare tunnel
# reaches the same port for scheduled pushes from outside.
ports:
  "8000/tcp": 8787
ports_description:
  "8000/tcp": Ingest endpoint (/ingest) and MCP endpoint (/mcp)
map:
  - share:rw          # drop historical Quick Export files here for backfill
options:
  db_host: ""
  db_port: 5432
  db_user: longcourse
  db_password: ""
  db_name: longcourse
  ingest_token: ""
  # Daily rollups are cut in this timezone rather than in UTC, which would
  # misfile early-morning sessions onto the previous day.
  tz: Europe/Kyiv
  # Where large archives (export.xml, Samsung zip) are dropped over Samba.
  archive_dir: /share/archive
  # Providers. Each can be switched off independently; the data already
  # stored stays and the dashboards keep showing it.
  hae_enabled: true
  # Garmin needs a one-off login before enabling (see docs/garmin.md):
  #   docker exec -it app_local_longcourse python -m importers.garmin --login
  # No Garmin password is stored here — only refreshable tokens, in /data.
  garmin_enabled: false
  garmin_token_dir: /data/garmin
  garmin_poll_minutes: 60
  garmin_lookback_days: 3
schema:
  db_host: str
  db_port: port
  db_user: str
  db_password: password
  db_name: str
  ingest_token: password
  tz: str
  archive_dir: str
  hae_enabled: bool
  garmin_enabled: bool
  garmin_token_dir: str
  garmin_poll_minutes: int(15,1440)
  garmin_lookback_days: int(1,30)
